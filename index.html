<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝活リスタート</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0096C7 0%, #48CAE4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; margin-top: 10px; }
        .card {
            background: white; border-radius: 16px; padding: 24px;
            margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .section-title {
            font-size: 15px; font-weight: 700; color: #333; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title .icon { font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: #555; margin-bottom: 6px;
        }
        .form-group select, .form-group input {
            width: 100%; padding: 11px; border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 15px; color: #333;
            background: #fafafa; appearance: none; -webkit-appearance: none;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none; border-color: #0096C7; background: white;
        }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "\25BC"; position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%); font-size: 12px; color: #999;
            pointer-events: none;
        }
        .form-group input[type="text"] {
            appearance: auto; -webkit-appearance: auto;
        }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
        .checkbox-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border: 2px solid #e0e0e0;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .checkbox-item.checked {
            border-color: #0096C7; background: #e8f4fd;
        }
        .checkbox-item input { display: none; }
        .checkbox-label { font-size: 14px; color: #333; }
        .hint { font-size: 11px; color: #999; margin-top: 4px; line-height: 1.5; }
        .btn-submit {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #0096C7 0%, #48CAE4 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            margin-top: 4px; box-shadow: 0 4px 12px rgba(0, 150, 199, 0.4);
            letter-spacing: 1px;
        }
        .btn-submit:active { opacity: 0.8; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading {
            text-align: center; padding: 60px 20px; color: white; font-size: 16px;
        }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-msg { text-align: center; padding: 40px 20px; }
        .success-msg .icon { font-size: 48px; margin-bottom: 12px; }
        .success-msg p { color: #333; font-size: 16px; line-height: 1.6; }
        .error-msg { text-align: center; padding: 40px 20px; }
        .error-msg p { color: #666; font-size: 14px; line-height: 1.6; }

        /* ── お申し込み画面 ── */
        .checkout-header {
            text-align: center; margin-bottom: 20px;
        }
        .checkout-header .icon { font-size: 40px; margin-bottom: 8px; }
        .checkout-header h2 {
            font-size: 20px; color: #333; margin-bottom: 4px;
        }
        .checkout-header p {
            font-size: 13px; color: #888;
        }
        .price-box {
            text-align: center; padding: 20px;
            background: #f0f9ff; border-radius: 12px; margin-bottom: 16px;
        }
        .price-box .price {
            font-size: 32px; font-weight: 800; color: #0096C7;
        }
        .price-box .price-note {
            font-size: 13px; color: #666; margin-top: 4px;
        }
        .price-box .discount-badge {
            display: inline-block; background: #FF6B6B; color: white;
            font-size: 12px; font-weight: 700; padding: 3px 10px;
            border-radius: 20px; margin-bottom: 8px;
        }
        .price-box .original-price {
            font-size: 16px; color: #999; text-decoration: line-through;
            margin-right: 4px;
        }
        .feature-list {
            list-style: none; margin-bottom: 20px;
        }
        .feature-list li {
            font-size: 14px; color: #444; padding: 6px 0;
            display: flex; align-items: center; gap: 8px;
        }
        .feature-list li::before {
            content: "\2714"; color: #0096C7; font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ローディング -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>読み込み中...</p>
        </div>

        <!-- お申し込み画面（未購入） -->
        <div id="checkout" style="display:none;">
            <div class="card">
                <div class="checkout-header">
                    <div class="icon">☀️</div>
                    <h2>朝活リスタート</h2>
                    <p>7日間のチャット朝活サポート</p>
                </div>

                <div class="price-box" id="priceBox">
                    <!-- JSで初回/リピートに応じて書き換え -->
                </div>

                <ul class="feature-list">
                    <li>毎朝LINEであなたをお待ちします</li>
                    <li>起きたい時間に合わせた朝活サポート</li>
                    <li>7日間で朝のリズムを立て直し</li>
                </ul>

                <button class="btn-submit" id="btnCheckout" onclick="goToCheckout()">
                    お支払いに進む
                </button>
            </div>
        </div>

        <!-- メインフォーム（設定画面・購入済み） -->
        <div id="main" style="display:none;">
            <div class="card">
                <div class="section-title">
                    <span class="icon">☀️</span>
                    朝活リスタート 設定
                </div>

                <div class="form-group">
                    <label>📅 開始日</label>
                    <input type="date" id="startDate">
                    <div class="hint">明日以降の日付を選んでください</div>
                </div>

                <div class="form-group">
                    <label>⏰ 起きたい時間</label>
                    <div class="select-wrapper">
                        <select id="wakeTime"></select>
                    </div>
                </div>

                <div class="form-group">
                    <label>📝 朝活の内容</label>
                    <input type="text" id="activity" placeholder="例: 筋トレ、勉強、読書">
                    <div class="hint">朝に取り組みたいことを教えてください</div>
                </div>

                <div class="form-group">
                    <label>💬 サポート内容</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item checked" data-value="report" onclick="toggleCheck(this)">
                            <input type="checkbox" checked>
                            <span class="checkbox-label">朝活を開始したことを報告したい</span>
                        </div>
                        <div class="checkbox-item" data-value="share" onclick="toggleCheck(this)">
                            <input type="checkbox">
                            <span class="checkbox-label">朝活の成果を共有したい</span>
                        </div>
                    </div>
                </div>

                <button class="btn-submit" id="btnSubmit" onclick="submitSetup()">
                    設定を完了する
                </button>
            </div>
        </div>

        <!-- 成功 -->
        <div id="success" style="display:none;">
            <div class="card success-msg">
                <div class="icon">🌅</div>
                <p id="successText"></p>
            </div>
        </div>

        <!-- エラー -->
        <div id="error" style="display:none;">
            <div class="card error-msg">
                <div class="icon" style="font-size:48px; margin-bottom:12px;">😢</div>
                <p id="errorText">エラーが発生しました。</p>
            </div>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ── 設定 ──
        const LIFF_ID = "2006372055-swDe08vt";
        const API_BASE = "https://api.asa-plant.com";

        let lineUserId = null;
        let checkoutUrl = null;

        // ── 初期化 ──
        async function init() {
            try {
                await liff.init({ liffId: LIFF_ID });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                lineUserId = profile.userId;

                // URLパラメータで mode=setup なら直接設定画面へ（購入完了後のリダイレクト）
                const params = new URLSearchParams(location.search);
                if (params.get("mode") === "setup") {
                    showSetupForm();
                    return;
                }

                // 購入状態を確認してルーティング
                await routeByPurchaseStatus();
            } catch (e) {
                showError("初期化に失敗しました: " + e.message);
            }
        }

        // ── 購入状態に応じて画面を切り替え ──
        async function routeByPurchaseStatus() {
            try {
                const resp = await fetch(`${API_BASE}/api/spot/checkout`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ line_user_id: lineUserId }),
                });

                if (resp.status === 409) {
                    // コミュニティ会員 → 購入不要
                    const data = await resp.json();
                    showError(data.detail || "コミュニティ会員の方はスポット購入は不要です。");
                    return;
                }

                if (!resp.ok) {
                    const data = await resp.json();
                    showError(data.detail || "エラーが発生しました");
                    return;
                }

                const data = await resp.json();
                checkoutUrl = data.checkout_url;

                // 価格表示を組み立て
                const priceBox = document.getElementById("priceBox");
                if (data.is_first) {
                    priceBox.innerHTML =
                        '<span class="discount-badge">初回 500円引き</span><br>' +
                        '<span class="original-price">&yen;1,000</span>' +
                        '<span class="price">&yen;500</span>' +
                        '<div class="price-note">7日間 &middot; 税込</div>';
                } else {
                    priceBox.innerHTML =
                        '<span class="price">&yen;1,000</span>' +
                        '<div class="price-note">7日間 &middot; 税込</div>';
                }

                document.getElementById("loading").style.display = "none";
                document.getElementById("checkout").style.display = "block";
            } catch (e) {
                showError("通信エラー: " + e.message);
            }
        }

        // ── Stripe Checkoutへ遷移 ──
        function goToCheckout() {
            const btn = document.getElementById("btnCheckout");
            btn.disabled = true;
            btn.textContent = "移動中...";

            if (checkoutUrl) {
                // LIFF内ブラウザから外部URLへ遷移
                if (liff.isInClient()) {
                    liff.openWindow({ url: checkoutUrl, external: true });
                } else {
                    window.location.href = checkoutUrl;
                }
            }
        }

        // ── 設定フォームを表示 ──
        function showSetupForm() {
            // 開始日のデフォルト（明日）
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const dateInput = document.getElementById("startDate");
            dateInput.value = tomorrow.toISOString().split("T")[0];
            dateInput.min = tomorrow.toISOString().split("T")[0];

            // 時刻オプション（4:00〜9:00、15分刻み）
            const timeSelect = document.getElementById("wakeTime");
            for (let h = 4; h <= 9; h++) {
                for (let m = 0; m < 60; m += 15) {
                    if (h === 9 && m > 0) break;
                    const val = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
                    const opt = document.createElement("option");
                    opt.value = val;
                    opt.textContent = val;
                    if (val === "06:00") opt.selected = true;
                    timeSelect.appendChild(opt);
                }
            }

            document.getElementById("loading").style.display = "none";
            document.getElementById("main").style.display = "block";
        }

        // ── チェックボックス切り替え ──
        function toggleCheck(el) {
            const cb = el.querySelector("input");
            cb.checked = !cb.checked;
            el.classList.toggle("checked", cb.checked);
        }

        // ── 設定送信 ──
        async function submitSetup() {
            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.textContent = "送信中...";

            const startDate = document.getElementById("startDate").value;
            const wakeTime = document.getElementById("wakeTime").value;
            const activity = document.getElementById("activity").value.trim();

            const checks = document.querySelectorAll(".checkbox-item input:checked");
            const supportType = Array.from(checks).map(c => c.parentElement.dataset.value).join(",");

            if (!startDate || !wakeTime) {
                alert("開始日と時間を選択してください");
                btn.disabled = false;
                btn.textContent = "設定を完了する";
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/spot/setup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        line_user_id: lineUserId,
                        start_date: startDate,
                        wake_time: wakeTime,
                        activity: activity,
                        support_type: supportType,
                    }),
                });

                const data = await resp.json();

                if (resp.ok && data.status === "ok") {
                    const start = new Date(data.start_date);
                    const end = new Date(data.end_date);
                    const startStr = `${start.getMonth() + 1}月${start.getDate()}日`;
                    const endStr = `${end.getMonth() + 1}月${end.getDate()}日`;

                    document.getElementById("successText").innerHTML =
                        `設定完了！<br><br>` +
                        `<strong>${startStr} 〜 ${endStr}</strong><br>` +
                        `毎朝 <strong>${wakeTime}</strong> にお待ちしています ☀️<br><br>` +
                        `このページを閉じてOKです。`;

                    document.getElementById("main").style.display = "none";
                    document.getElementById("success").style.display = "block";

                    // 3秒後にLIFFを閉じる
                    setTimeout(() => {
                        if (liff.isInClient()) liff.closeWindow();
                    }, 3000);
                } else {
                    showError(data.detail || "設定に失敗しました");
                }
            } catch (e) {
                showError("通信エラー: " + e.message);
            }
        }

        function showError(msg) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("main").style.display = "none";
            document.getElementById("checkout").style.display = "none";
            document.getElementById("errorText").textContent = msg;
            document.getElementById("error").style.display = "block";
        }

        init();
    </script>
</body>
</html>
